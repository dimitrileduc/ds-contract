<!--
  Checkbox — static HTML+CSS emitted from contract ds.checkbox v1.0.1 by core/emit-html.ts.
  Token values arrive via CSS custom properties (the same custom-property names the CSS Modules
  bind) — include the token stylesheet (src/styles/tokens.css) on the page or nothing resolves.
  Fidelity: no events, no interactivity beyond CSS states (:hover/:focus-visible/:disabled).
  Slots render their declared defaultContent; an empty slot renders its wrapper empty (absent content
  is absent — named in an inline comment, never painted as placeholder text). Booleans render per showcase item.
-->
<section class="showcase showcase--checkbox">
  <div class="showcase__item">
    <p class="showcase__label">default</p>
    <span class="checkbox checkbox--checked-non" data-part="root">
      <input class="checkbox__input" type="checkbox" data-part="input">
    </span>
  </div>
  <div class="showcase__item">
    <p class="showcase__label">checked=oui</p>
    <span class="checkbox checkbox--checked-oui" data-part="root">
      <input class="checkbox__input" type="checkbox" data-part="input">
      <span class="checkbox__checkGlyph" aria-hidden="true" data-part="checkGlyph"><svg width="13" height="10" viewBox="0 0 13 10" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M1 5.4L4.5 9L11.5 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></span>
    </span>
  </div>
</section>
