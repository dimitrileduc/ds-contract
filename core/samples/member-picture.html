<!--
  MemberPicture — static HTML+CSS emitted from contract ds.member-picture v1.2.1 by core/emit-html.ts.
  Token values arrive via CSS custom properties (the same custom-property names the CSS Modules
  bind) — include the token stylesheet (src/styles/tokens.css) on the page or nothing resolves.
  Fidelity: no events, no interactivity beyond CSS states (:hover/:focus-visible/:disabled).
  Slots render their declared defaultContent; an empty slot renders its wrapper empty (absent content
  is absent — named in an inline comment, never painted as placeholder text). Booleans render per showcase item.
-->
<section class="showcase showcase--member-picture">
  <div class="showcase__item">
    <p class="showcase__label">default</p>
    <div class="member-picture member-picture--etat-defaut member-picture--taille-standard" data-part="root">
      <img class="member-picture__funIa" alt="" data-part="funIa"></img>
      <img class="member-picture__normal" src="" alt="" data-part="normal"></img>
    </div>
  </div>
  <div class="showcase__item">
    <p class="showcase__label">etat=survol</p>
    <div class="member-picture member-picture--etat-survol member-picture--taille-standard" data-part="root">
      <img class="member-picture__funIa" alt="" data-part="funIa"></img>
      <img class="member-picture__normal" src="" alt="" data-part="normal"></img>
    </div>
  </div>
  <div class="showcase__item">
    <p class="showcase__label">taille=member-card</p>
    <div class="member-picture member-picture--etat-defaut member-picture--taille-member-card" data-part="root">
      <img class="member-picture__funIa" alt="" data-part="funIa"></img>
      <img class="member-picture__normal" src="" alt="" data-part="normal"></img>
    </div>
  </div>
</section>
