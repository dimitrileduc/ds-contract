; Configuration de l'instance jetable de qualification — spec 019, T003/T016.
; Aucun secret : la base est détruite et recréée à chaque cycle.
[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_host = db
; Une seule base, nommée par la QA : la liste de bases est désactivée pour que
; l'éditeur ouvre directement au lieu de proposer un sélecteur.
list_db = True
without_demo = all
; Un worker suffit et rend les journaux lisibles ; le mode multi-worker
; entrelacerait les traces de deux requêtes dans un reçu.
workers = 0
log_level = warn
limit_time_real = 300
